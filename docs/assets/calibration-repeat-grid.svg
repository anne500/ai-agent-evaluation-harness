<svg xmlns="http://www.w3.org/2000/svg" width="950" height="630" viewBox="0 0 950 630" role="img" aria-labelledby="title desc">
<title id="title">The same false negative persisted across four calibration runs</title><desc id="desc">Original run and three new trials used the same eight fixtures. Each run agreed on seven labels and returned NO instead of YES for requested_yes. Every verdict was valid and no judge errors occurred.</desc>
<rect width="950" height="630" rx="18" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
