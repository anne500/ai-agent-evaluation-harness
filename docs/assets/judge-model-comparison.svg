<svg xmlns="http://www.w3.org/2000/svg" width="850" height="630" viewBox="0 0 850 630" role="img" aria-labelledby="title desc">
<title id="title">Judge observations on eight frozen fixtures</title><desc id="desc">Qwen 3.5 4B agreed on seven of eight in each of four runs. Llama 3.2 3B agreed on six of eight in one run. Both rejected requested_yes; Llama also rejected count_yes. Both produced zero judge errors. Unequal repetitions, exploratory comparison only.</desc>
