/text><rect x="577" y="464" width="166" height="38" rx="6" fill="#dcfce7" stroke="#15803d"/><text x="660" y="490" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">NO</text><text x="32" y="542" font-size="17" font-weight="700">Per run agreement: Qwen 7/8; Llama 6/8. Zero judge errors.</text>
