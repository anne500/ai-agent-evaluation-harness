<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img" aria-labelledby="title desc">
<title id="title">Judge calibration: seven of eight verdicts agree</title>
<desc id="desc">One eight-case synthetic calibration run. Expected YES: judge YES 3, judge NO 1. Expected NO: judge YES 0, judge NO 4. Eight valid verdicts and zero judge errors. Single run, not a general reliability estimate.</desc>
<rect width="840" height="480" rx="18" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="36" y="42" font-size="25" font-weight="700">Judge calibration: 7 of 8 verdicts agree</text>
<text x="36" y="70" font-size="16" fill="#475569">Eight fixed synthetic examples. One run. Qwen 3.5 4B. Zero judge errors.</text>
<text x="370" y="116" text-anchor="middle" font-size="18" font-weight="700">Judge YES</text>
<text x="620" y="116" text-anchor="middle" font-size="18" font-weight="700">Judge NO</text>
<text x="210" y="198" text-anchor="end" font-size="17" font-weight="700">Expected YES</text>
<text x="210" y="321" text-anchor="end" font-size="17" font-weight="700">Expected NO</text>
<rect x="250" y="138" width="240" height="112" rx="10" fill="#dcfce7" stroke="#15803d"/>
<rect x="500" y="138" width="240" height="112" rx="10" fill="#ffedd5" stroke="#c2410c"/>
<rect x="250" y="260" width="240" height="112" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<rect x="500" y="260" width="240" height="112" rx="10" fill="#dcfce7" stroke="#15803d"/>
<text x="370" y="188" text-anchor="middle" font-size="35" font-weight="700">3</text>
<text x="370" y="222" text-anchor="middle" font-size="16">True positives</text>
<text x="620" y="188" text-anchor="middle" font-size="35" font-weight="700">1</text>
<text x="620" y="222" text-anchor="middle" font-size="16">False negative</text>
<text x="370" y="310" text-anchor="middle" font-size="35" font-weight="700">0</text>
<text x="370" y="344" text-anchor="middle" font-size="16">False positives</text>
<text x="620" y="310" text-anchor="middle" font-size="35" font-weight="700">4</text>
<text x="620" y="344" text-anchor="middle" font-size="16">True negatives</text>
<text x="36" y="413" font-size="16" fill="#9a3412">False negative: required word_count request was present; judge returned NO.</text>
<text x="36" y="445" font-size="15" fill="#475569">87.5% agreement on these fixtures is not evidence of general reliability.</text>
<text x="36" y="467" font-size="13" fill="#64748b">Source: inspected Windows calibration report, November 9, 2026.</text>
</g></svg>
